name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the app has been scaffolded
        id: app
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet (app not scaffolded). Skipping checks."
          fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Lint, typecheck, unit tests with coverage, build
        if: steps.app.outputs.exists == 'true'
        run: npm run verify

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check whether end-to-end tests exist
        id: app
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No test:e2e script yet. Skipping end-to-end tests."
          fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.app.outputs.exists == 'true'
        run: npx playwright install --with-deps chromium

      # Agents: when end-to-end tests need a database, ADD a step here that
      # starts local Supabase (for example with the Supabase CLI) before the
      # tests run. Never remove or skip the steps in this workflow.

      - name: Run end-to-end tests
        if: steps.app.outputs.exists == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure() && steps.app.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
