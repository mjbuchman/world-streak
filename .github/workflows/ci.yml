name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the app has been scaffolded
        id: app
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet (app not scaffolded). Skipping checks."
          fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Lint, typecheck, unit tests with coverage, build
        if: steps.app.outputs.exists == 'true'
        run: npm run verify

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check whether end-to-end tests exist
        id: app
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No test:e2e script yet. Skipping end-to-end tests."
          fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.app.outputs.exists == 'true'
        # No --with-deps (human-approved, Nov 11, 2026): its apt step failed 4 times when the
        # runner could not resolve the Ubuntu mirror, and the runner image already has
        # Chromium's libraries.
        run: npx playwright install chromium

      # Agents: when end-to-end tests need a database, ADD a step here that
      # starts local Supabase (for example with the Supabase CLI) before the
      # tests run. Never remove or skip the steps in this workflow.

      # The Supabase CLI is a pinned devDependency, so `npm ci` installs it.
      - name: Check the Supabase CLI
        if: steps.app.outputs.exists == 'true'
        run: npx supabase --version

      # supabase/config.toml points at this git-ignored key (T58).
      - name: Create the local JWT signing key
        if: steps.app.outputs.exists == 'true'
        run: npm run db:keys

      - name: Start local Supabase
        if: steps.app.outputs.exists == 'true'
        run: npx supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Export local Supabase keys to the environment
        if: steps.app.outputs.exists == 'true'
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            grep -q "^${name}=." "$GITHUB_ENV" || { echo "::error::supabase status did not print ${name}"; exit 1; }
          done

      - name: Run database tests
        if: steps.app.outputs.exists == 'true'
        run: npm run test:db

      - name: Run end-to-end tests
        if: steps.app.outputs.exists == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure() && steps.app.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
